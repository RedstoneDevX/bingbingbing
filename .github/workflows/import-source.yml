name: import-source

on:
  push:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 下载源文件（仅在 index.html 缺失时）
        run: |
          if [ -s index.html ]; then
            echo "index.html 已存在，跳过下载"
            exit 0
          fi
          curl -fsSL "https://aka.doubaocdn.com/s/Lq7wv16Wsa" -o index.html
          ls -l index.html
          head -c 80 index.html
      - name: 提交
        run: |
          if [ ! -s index.html ]; then
            echo "index.html 缺失，跳过提交"
            exit 0
          fi
          git add index.html
          if git diff --quiet --cached; then
            echo "index.html 无变化，跳过提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "auto-import: 导入冰冰冰小游戏源码"
          git push
