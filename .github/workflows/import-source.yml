name: import-source

on:
  push:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 下载源文件（仅在 index.html 缺失时）
        run: |
          if [ -s index.html ]; then
            echo "index.html 已存在，跳过"
            exit 0
          fi
          curl -fsSL "https://aka.doubaocdn.com/s/Lq7wv16Wsa" -o index.html
          ls -l index.html
          head -c 80 index.html
      - name: 提交
        run: |
          if [ -s index.html ] && ! git diff --quiet -- index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "auto-import: 导入冰冰冰小游戏源码"
            git push
          else
            echo "无需提交"
          fi
